version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm
        - pnpm install --frozen-lockfile
    build:
      commands:
        # NEXT_PUBLIC_* vars must exist at build time (set them in Amplify > Environment variables)
        - pnpm build
  artifacts:
    # Next.js SSR (dynamic routes, sitemap, generateMetadata) is served from .next, not a static export
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
